<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gowtam's room (3D prototype)</title>
<meta name="description" content="Concept prototype: a cozy low-poly 3D room where each object opens a section of Gowtam's site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --navy: #0b1220;
    --navy-2: #121c31;
    --ink: #e8eef7;
    --muted: #a6b3c7;
    --faint: #6f7e97;
    --accent: #22d3ee;
    --accent-ink: #7fe8f7;
    --accent-soft: rgba(34, 211, 238, 0.12);
    --line: rgba(148, 163, 184, 0.16);
    --serif: "Fraunces", Georgia, serif;
    --sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: #0b1220;
    -webkit-font-smoothing: antialiased;
  }
  /* Backdrop behind the diorama follows the time of day */
  .backdrop { position: fixed; inset: 0; z-index: 0; transition: opacity 1.2s; }
  body[data-tod="night"] .backdrop { background: radial-gradient(120% 95% at 50% 42%, #1b2946 0%, #0e172c 48%, #070b16 100%); }
  body[data-tod="dawn"]  .backdrop { background: radial-gradient(120% 95% at 50% 40%, #fbe3cf 0%, #efbfae 45%, #9d93b8 100%); }
  body[data-tod="day"]   .backdrop { background: radial-gradient(120% 95% at 50% 40%, #fbf7f0 0%, #eadfce 55%, #cdbfae 100%); }
  body[data-tod="dusk"]  .backdrop { background: radial-gradient(120% 95% at 50% 40%, #f7b98f 0%, #c77f8a 48%, #4a3f6e 100%); }
  .backdrop::after {
    content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, #fff9 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 34%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 72%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 64% 86%, #fff5 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 6% 48%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 70%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 8%, #fff7 50%, transparent 51%);
  }
  body[data-tod="night"] .backdrop::after { opacity: 1; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; touch-action: manipulation; outline: none; }
  #scene.pointer { cursor: pointer; }

  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* HUD */
  .hud {
    position: fixed; z-index: 10; top: max(14px, env(safe-area-inset-top)); left: 16px;
    display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 10px;
    background: rgba(11, 18, 32, 0.72); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px -12px rgba(0,0,0,.45);
  }
  .hud-avatar {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #22d3ee, #0e7490); color: #04111a;
    font: 600 14px/1 var(--serif);
  }
  .hud-id { display: flex; flex-direction: column; gap: 2px; }
  .hud-name { font: 600 14px/1.1 var(--serif); letter-spacing: .005em; }
  .hud-role { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .hud-plain {
    margin-left: 4px; padding-left: 12px; border-left: 1px solid var(--line);
    color: var(--muted); font-size: 12px; text-decoration: none; white-space: nowrap;
  }
  .hud-plain:hover, .hud-plain:focus-visible { color: var(--accent-ink); }
  .hud-right { position: fixed; z-index: 10; top: max(14px, env(safe-area-inset-top)); right: 16px; display: flex; gap: 8px; }
  .pill-btn {
    font: 500 12px/1 var(--sans); color: var(--ink); cursor: pointer;
    padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(11, 18, 32, 0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pill-btn:hover { border-color: rgba(34,211,238,.45); }
  .pill-btn .sky-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Hotspot nav: also the keyboard path */
  .spots {
    position: fixed; z-index: 10; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; gap: 4px; padding: 5px;
    background: rgba(11, 18, 32, 0.66); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .35s, transform .35s var(--ease);
    max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none;
  }
  .spots::-webkit-scrollbar { display: none; }
  .spots button {
    font: 500 13px/1 var(--sans); color: var(--muted); background: transparent; border: 0;
    padding: 9px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: color .2s, background .2s;
  }
  .spots button:hover, .spots button:focus-visible, .spots button[aria-current="true"] { color: var(--ink); background: rgba(34,211,238,.14); }
  .spots button:focus-visible { outline-offset: -2px; }
  .spots .sep { width: 1px; background: var(--line); margin: 6px 2px; flex: none; }
  .spots button[aria-pressed="true"] .bulb { background: #ffd28a; box-shadow: 0 0 8px #ffb86b; }
  .bulb { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4b5870; margin-right: 6px; vertical-align: 1px; }

  /* Hover chip */
  .chip {
    position: fixed; left: 0; top: 0; z-index: 12; pointer-events: none;
    display: flex; align-items: center; gap: 8px; padding: 8px 13px 8px 11px;
    border-radius: 999px; background: rgba(11, 18, 32, 0.9); border: 1px solid rgba(34,211,238,.38);
    color: var(--ink); font: 600 13px/1 var(--sans); white-space: nowrap;
    box-shadow: 0 10px 26px -10px rgba(0,0,0,.6);
    opacity: 0; transform: translate(-50%, calc(-100% + 6px)); transition: opacity .18s, transform .22s var(--ease);
  }
  .chip.show { opacity: 1; transform: translate(-50%, -100%); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .chip .hint { color: var(--faint); font-weight: 500; }

  /* Title card */
  .title-card {
    position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; pointer-events: none;
    text-align: center; transition: opacity 1s ease, transform 1.2s var(--ease);
  }
  .title-card.gone { opacity: 0; transform: translateY(-10px); }
  .title-card .inner {
    padding: 26px 34px 22px; border-radius: 24px;
    background: rgba(11, 18, 32, 0.55); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.6);
  }
  .title-card h1 { margin: 0; font: 400 clamp(38px, 7vw, 64px)/1 var(--serif); letter-spacing: -.01em; }
  .title-card h1 em { font-style: italic; color: var(--accent-ink); }
  .title-card p { margin: 12px 0 0; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .title-card p::after { content: "_"; margin-left: 2px; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Detail panel */
  .panel {
    position: fixed; z-index: 30; top: 16px; right: 16px; bottom: 16px;
    width: min(460px, calc(45vw - 24px));
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(16, 26, 46, 0.97), rgba(11, 18, 32, 0.98));
    border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04);
    transform: translateX(calc(100% + 40px)); opacity: 0;
    transition: transform .6s var(--ease), opacity .4s ease;
  }
  .panel.open { transform: none; opacity: 1; }
  .sheet-handle { display: none; }
  .panel-close {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(255,255,255,.03); color: var(--ink); cursor: pointer; display: grid; place-items: center;
    transition: background .2s, border-color .2s;
  }
  .panel-close:hover { background: rgba(34,211,238,.12); border-color: rgba(34,211,238,.45); }
  .panel-scroll { flex: 1; overflow-y: auto; padding: 30px 30px 28px; overscroll-behavior: contain; }
  .kicker {
    margin: 0 0 10px; font: 600 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
    display: flex; align-items: center; gap: 8px;
  }
  .kicker::before { content: ""; width: 18px; height: 1.5px; background: var(--accent); border-radius: 2px; }
  .panel h2 { margin: 0 44px 16px 0; font: 400 34px/1.08 var(--serif); letter-spacing: -.01em; outline: none; }
  .lede { margin: 0 0 22px; font-size: 16px; line-height: 1.65; color: #cfd8e6; }
  .panel h3 { margin: 22px 0 10px; font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .cards { display: grid; gap: 10px; }
  .card {
    display: block; text-decoration: none; color: inherit;
    padding: 16px 16px 15px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.025);
    transition: border-color .2s, background .2s, transform .25s var(--ease);
  }
  .card:hover, .card:focus-visible { border-color: rgba(34,211,238,.45); background: rgba(34,211,238,.06); transform: translateY(-2px); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
  .card-name { font: 600 19px/1.1 var(--serif); }
  .card p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
  .card-name .arr { display: inline-block; margin-left: 6px; color: var(--accent); transition: transform .25s var(--ease); }
  .card:hover .arr { transform: translateX(3px); }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font: 600 11px/1 var(--sans); letter-spacing: .04em; padding: 6px 9px; border-radius: 999px;
    background: rgba(148,163,184,.12); color: #c9d3e1;
  }
  .tag i { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; }
  .tag.pro { background: rgba(34,211,238,.12); color: var(--accent-ink); }
  .tag.pro i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .text-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; color: var(--accent-ink); font-weight: 600; font-size: 14px; text-decoration: none; }
  .text-link:hover { text-decoration: underline; text-underline-offset: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .fill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 9px; border: 1.5px dashed rgba(34,211,238,.55);
    background: rgba(34,211,238,.05); color: var(--accent-ink);
    font: 500 13px/1.25 var(--sans);
  }
  .facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .facts li { position: relative; padding: 12px 14px 12px 34px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
  .facts li::before { content: ""; position: absolute; left: 15px; top: 19px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px rgba(34,211,238,.7); }
  .spec { display: grid; gap: 10px; margin: 0; }
  .spec > div { padding: 13px 14px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
  .spec dt { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 9px; }
  .spec dd { margin: 0; }
  .btns { display: grid; gap: 10px; margin-top: 6px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
    padding: 15px 18px; border-radius: 999px; font: 600 15px/1 var(--sans);
    transition: transform .2s var(--ease), box-shadow .2s, background .2s;
  }
  .btn-primary { background: var(--accent); color: #04121a; box-shadow: 0 12px 30px -12px rgba(34,211,238,.7); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 36px -12px rgba(34,211,238,.85); }
  .btn-ghost { border: 1px solid rgba(34,211,238,.45); color: var(--ink); }
  .btn-ghost:hover { background: rgba(34,211,238,.1); }
  .legend { margin: 26px 0 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
  .legend .fill { padding: 2px 6px; font-size: 11px; }

  /* Purr easter egg */
  .purr {
    position: fixed; z-index: 13; pointer-events: none;
    font: italic 600 20px/1 var(--serif); color: #ffd9a8; text-shadow: 0 2px 12px rgba(0,0,0,.55);
    animation: purr 1.7s ease-out forwards;
  }
  @keyframes purr {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.8); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(1.06); }
  }

  .fallback {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; padding: 24px;
    background: #0b1220; color: var(--ink);
  }
  .fallback[hidden] { display: none; }
  .fallback a { color: var(--accent-ink); }

  body.zoomed .spots { opacity: 0; pointer-events: none; transform: translate(-50%, 12px); }

  /* Narrow and portrait screens: panel becomes a bottom sheet */
  @media (max-width: 760px), (orientation: portrait) and (max-width: 1100px) {
    .panel {
      top: auto; left: 0; right: 0; bottom: 0; width: auto;
      height: 56vh; height: 56dvh; border-radius: 22px 22px 0 0; border-bottom: 0;
      transform: translateY(104%); opacity: 1;
    }
    .panel.open { transform: none; }
    .sheet-handle { display: block; width: 42px; height: 4px; border-radius: 4px; background: rgba(148,163,184,.35); margin: 10px auto 0; flex: none; }
    .panel-scroll { padding: 18px 22px calc(26px + env(safe-area-inset-bottom)); }
    .panel h2 { font-size: 28px; }
    .panel-close { top: 12px; right: 12px; }
    .hud-role { display: none; }
    .hud { padding: 6px 12px 6px 8px; gap: 10px; }
    .hud-plain { padding-left: 10px; }
    .pill-btn { padding: 9px 12px; }
    .pill-btn .sky-label { display: none; }
  }
  @media (max-width: 420px) {
    .hud-id { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body data-tod="night">
  <div class="backdrop" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="hud">
    <span class="hud-avatar" aria-hidden="true">G</span>
    <span class="hud-id"><span class="hud-name">Gowtam Ramanujam</span><span class="hud-role">AI Architect</span></span>
    <a class="hud-plain" href="/work">a plain version <span aria-hidden="true">&rarr;</span></a>
  </header>
  <div class="hud-right">
    <button id="sky-btn" class="pill-btn" type="button" aria-label="Change sky time of day"><span class="sky-dot" aria-hidden="true"></span><span class="sky-label">Sky: auto</span></button>
  </div>

  <div id="title-card" class="title-card">
    <div class="inner">
      <h1>Gowtam's <em>room</em></h1>
      <p>click anything</p>
    </div>
  </div>

  <nav class="spots" aria-label="Things in the room">
    <button type="button" data-spot="work">Work</button>
    <button type="button" data-spot="games">Games</button>
    <button type="button" data-spot="cars">Cars</button>
    <button type="button" data-spot="about">About</button>
    <button type="button" data-spot="contact">Contact</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-spot="switch" id="lights-btn" aria-pressed="true"><span class="bulb" aria-hidden="true"></span>Lights</button>
  </nav>

  <div id="chip" class="chip" aria-hidden="true"><span class="dot"></span><span class="chip-text"></span><span class="hint"></span></div>

  <aside id="panel" class="panel" role="dialog" aria-labelledby="panel-title" aria-hidden="true" inert>
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="panel-close" id="panel-close" type="button" aria-label="Close and return to the room">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="panel-scroll" id="panel-scroll">
      <p class="kicker" id="panel-kicker"></p>
      <h2 id="panel-title" tabindex="-1"></h2>
      <div id="panel-body"></div>
      <p class="legend"><span class="fill">[ ]</span> Dashed chips are placeholders to fill in.</p>
    </div>
  </aside>

  <div id="sr-live" class="sr-only" aria-live="polite"></div>
  <div id="fallback" class="fallback" hidden>
    <div>
      <p style="font: 400 28px/1.2 var(--serif); margin: 0 0 10px;">The room could not load.</p>
      <p style="color: var(--muted); margin: 0;">WebGL or the 3D library is unavailable here. Try <a href="/work">the plain version</a>.</p>
    </div>
  </div>

  <script>
    // If the module never boots (CDN blocked, no WebGL), show a friendly fallback.
    setTimeout(function () { if (!window.__roomReady) document.getElementById('fallback').hidden = false; }, 9000);
  </script>

<script type="module">
// Gowtam's room, 3D concept prototype. Everything is built procedurally below.
// URL params for review: ?time=night|dawn|day|dusk forces the sky, ?spot=work|games|cars|about|contact opens an object.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const V3 = THREE.Vector3;
const UP = new V3(0, 1, 0);
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sheetMQ = matchMedia('(max-width: 760px), (orientation: portrait) and (max-width: 1100px)');

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(11);
const R = (a, b) => a + (b - a) * rng();
const pickR = (arr) => arr[Math.floor(rng() * arr.length)];

/* ---------------------------------------------------------------- renderer */
const canvas = $('#scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, stencil: true, powerPreference: 'high-performance' });
} catch (e) {
  $('#fallback').hidden = false;
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1b2946, 45, 170);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.3, 400);

/* ---------------------------------------------------------------- helpers */
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, ...o });
function place(mesh, parent, x = 0, y = 0, z = 0, shadow = true) {
  mesh.position.set(x, y, z);
  if (shadow) { mesh.castShadow = true; mesh.receiveShadow = true; }
  parent.add(mesh);
  return mesh;
}
function rbox(w, h, d, m, parent, x, y, z, r) {
  const rad = r ?? Math.min(w, h, d) * 0.2;
  return place(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.max(0.0015, rad)), m), parent, x, y, z);
}
function bx(w, h, d, m, parent, x, y, z) { return place(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m), parent, x, y, z); }
function cyl(rt, rb, h, m, parent, x, y, z, seg = 20, open = false) { return place(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), m), parent, x, y, z); }
function sph(r, m, parent, x, y, z, ws = 16, hs = 12) { return place(new THREE.Mesh(new THREE.SphereGeometry(r, ws, hs), m), parent, x, y, z); }
function rod(a, b, r, m, parent, seg = 10) {
  const dir = new V3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), m);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function canvasTex(w, h, draw, { nearest = false, srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (draw) draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; }
  else t.anisotropy = maxAniso;
  t.userData.ctx = g; t.userData.draw = draw;
  return t;
}
function redraw(t) { const g = t.userData.ctx; t.userData.draw(g, g.canvas.width, g.canvas.height); t.needsUpdate = true; }
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function planeOn(w, h, mat, parent, x, y, z, ry = 0, rx = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0); m.receiveShadow = true;
  parent.add(m); return m;
}

const fairyBulbs = [];
function fairy(a, b, segs, sag) {
  const pts = [];
  for (let s = 0; s < segs; s++) {
    for (let k = 0; k <= 12; k++) {
      if (s > 0 && k === 0) continue;
      const f = (s + k / 12) / segs;
      const p = new V3().lerpVectors(a, b, f);
      p.y -= Math.sin(Math.PI * k / 12) * sag;
      pts.push(p);
    }
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length * 3, 0.012, 5), std('#2b2622'));
  room.add(tube);
  const colors = ['#ffd08a', '#ffb36b', '#fff1c9', '#ffd08a', '#8ff0ff'];
  const n = segs * 9;
  for (let i = 1; i < n; i++) {
    const p = curve.getPoint(i / n);
    const col = colors[i % colors.length];
    const m = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 2, roughness: 0.4 });
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), m);
    b.position.copy(p).add(new V3(0, -0.05, 0));
    room.add(b);
    fairyBulbs.push({ m, phase: R(0, Math.PI * 2), speed: R(0.8, 2.2) });
  }
}

const TODS = {
  night: { sky: ['#050a1a', '#15234a', '#2d3b66'], fog: '#1b2946', sun: '#9db4ff', sunI: 0.9, sunPos: [-16, 11, -6], hemiSky: '#5a6ea8', hemiGround: '#1b1512', hemiI: 0.55, fill: '#8193c4', fillI: 0.3, lamps: true, stars: true, moon: true, exposure: 1.05 },

  day:   { sky: ['#3a8ae0', '#8cc4f2', '#e3f3ff'], fog: '#dcebf7', sun: '#fff4e0', sunI: 3.2, sunPos: [-15, 13, -5], hemiSky: '#e6f2ff', hemiGround: '#b38e6a', hemiI: 1.15, fill: '#fff6ea', fillI: 0.9, lamps: false, stars: false, moon: false, exposure: 1.0 },
  dusk:  { sky: ['#2e2c66', '#c46a7c', '#ffa35c'], fog: '#e59a7c', sun: '#ff9a5a', sunI: 2.2, sunPos: [-18, 6, 5], hemiSky: '#ffcfae', hemiGround: '#4a2f2a', hemiI: 0.8, fill: '#ffd0b0', fillI: 0.45, lamps: true, stars: false, moon: false, exposure: 1.0 },
};
const todFromHour = (h) => (h >= 20 || h < 6 ? 'night' : h < 8 ? 'dawn' : h < 17 ? 'day' : 'dusk');
const params = new URLSearchParams(location.search);
let skyMode = TODS[params.get('time')] ? params.get('time') : 'auto';
let tod = 'night';
let lightsOn = true;
let lampLevel = 1;

function applyTOD(initial) {
  tod = skyMode === 'auto' ? todFromHour(new Date().getHours()) : skyMode;
  const t = TODS[tod];
  document.body.dataset.tod = tod;
  skyTex.userData.draw = (c, w, h) => {
    const gr = c.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, t.sky[0]); gr.addColorStop(0.3, t.sky[1]); gr.addColorStop(0.5, t.sky[2]); gr.addColorStop(1, t.sky[2]);
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
  };
  redraw(skyTex);
  scene.fog.color.set(t.fog);
  sun.color.set(t.sun); sun.intensity = t.sunI;
  sun.position.set(-2 + t.sunPos[0], t.sunPos[1], t.sunPos[2]);
  hemi.color.set(t.hemiSky); hemi.groundColor.set(t.hemiGround); hemi.intensity = t.hemiI;
  fill.color.set(t.fill); fill.intensity = t.fillI;
  renderer.toneMappingExposure = t.exposure;
  celestial.stars.visible = t.stars;
  celestial.moon.visible = t.moon;
  celestial.sun.visible = !t.moon;
  celestial.sun.material.color.set(tod === 'day' ? '#fff6d8' : '#ffc08a');
  celestial.glow.material.color.set(t.moon ? '#c9d6ff' : tod === 'day' ? '#fff6d8' : '#ffb07a');
  celestial.glow.material.opacity = t.moon ? 0.35 : 0.7;
  celestial.clouds.forEach((c) => { c.visible = tod !== 'night'; });
  const night = tod === 'night', dim = tod === 'dusk' || tod === 'dawn';
  houseWindows.forEach((m, i) => { m.emissiveIntensity = night ? (i % 3 === 1 ? 0.3 : 1.4) : dim ? 0.5 : 0; });
  refs.streetHead.emissiveIntensity = night ? 3 : dim ? 1.2 : 0;
  streetLight.intensity = night ? 30 : dim ? 8 : 0;
  carParts.lights.forEach((m) => { m.emissiveIntensity = night ? 0.8 : 0.3; });
  setLights(t.lamps, false);
  if (initial) lampLevel = lightsOn ? 1 : 0;
  const label = skyMode === 'auto' ? `Sky: auto (${tod})` : `Sky: ${tod}`;
  $('#sky-btn .sky-label').textContent = label;
  $('#sky-btn').setAttribute('aria-label', `${label}. Change sky time of day`);
  renderer.shadowMap.needsUpdate = true;
}

const CODE = `// agent.ts
import { Agent, tool } from "./runtime";

const searchDocs = tool({
  name: "search_docs",
  description: "Find sources, cite them",
  run: async ({ query }) => index.search(query, { k: 8 }),
});

export const oak = new Agent({
  model: "reasoning-large",
  tools: [searchDocs, readTable, calc],
  memory: { kind: "episodic", ttl: "7d" },
  guardrails: ["cite-sources", "flag-uncertainty"],
});

async function answer(question: string) {

  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
  $('#sr-live').textContent = 'The cat purrs.';
}

// steam + zzz sprites
const steam = [];
for (let i = 0; i < 5; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: '#ffffff', transparent: true, opacity: 0, depthWrite: false }));
  s.scale.setScalar(0.16); scene.add(s); steam.push({ s, ph: i / 5 });
}
const zTex = canvasTex(64, 64, (c, w) => { c.fillStyle = '#f7f2e8'; c.font = 'italic 600 44px "Fraunces", Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('z', w / 2, w / 2); });
const zzz = [];
for (let i = 0; i < 3; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: zTex, transparent: true, opacity: 0, depthWrite: false }));
  s.scale.setScalar(0.22); scene.add(s); zzz.push({ s, ph: i / 3 });
}

// redraw text textures once web fonts arrive
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('600 30px "Caveat"'), document.fonts.load('italic 400 17px "Fraunces"'),
    document.fonts.load('italic 600 44px "Fraunces"'), document.fonts.load('700 34px "Plus Jakarta Sans"'),
  ]).then(() => { notes.forEach(redraw); redraw(refs.posterTex); redraw(zTex); redraw(refs.phoneTex); }).catch(() => {});
}

/* ================================================================= LOOP */
const clock = new THREE.Clock();
const parallax = new THREE.Vector2();
const tmpF = new V3(), tmpR = new V3(), tmpU = new V3(), tmpC = new THREE.Color();
let codeAcc = 1, gameAcc = 1, lastMinute = -1;

function updateCamera(now, dt) {
  if (tween) {
    const p = clamp((now - tween.t0) / tween.dur, 0, 1);
    const e = easeInOut(p);
    camState.pos.lerpVectors(tween.from.pos, tween.to.pos, e);
    camState.look.lerpVectors(tween.from.look, tween.to.look, e);
    camState.ox = tween.from.ox + (tween.to.ox - tween.from.ox) * e;
    camState.oy = tween.from.oy + (tween.to.oy - tween.from.oy) * e;
    if (p >= 1) tween = null;
  }
  const W = innerWidth, H = innerHeight;
  if (Math.abs(camState.ox) > 1e-4 || Math.abs(camState.oy) > 1e-4) camera.setViewOffset(W, H, camState.ox * W, camState.oy * H, W, H);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();
  const on = !current && !reduceMotion;
  parallax.x += ((on ? mouse.x : 0) - parallax.x) * Math.min(1, dt * 2.5);
  parallax.y += ((on ? mouse.y : 0) - parallax.y) * Math.min(1, dt * 2.5);
  tmpF.subVectors(camState.look, camState.pos).normalize();
  tmpR.crossVectors(tmpF, UP).normalize();
  tmpU.crossVectors(tmpR, tmpF);
  camera.position.copy(camState.pos).addScaledVector(tmpR, parallax.x * 0.9).addScaledVector(tmpU, parallax.y * 0.5);
  camera.lookAt(camState.look);
}

function updateHover() {
  let id = null;
  if (pointerInside && !downAt) id = pick(pointer);
  hovered = id;
  canvas.classList.toggle('pointer', !!id);
  const show = hovered || navFocus;
  if (show && show !== current) {
    const s = spots[show];
    const [x, y, z] = project(s.anchor);
    if (z < 1) {
      chip.style.left = x + 'px'; chip.style.top = (y - 14) + 'px';
      let label = s.label;
      if (show === 'switch') label = lightsOn ? 'Lights: on' : 'Lights: off';
      chip.querySelector('.chip-text').textContent = label;
      chip.querySelector('.hint').textContent = s.hint ? s.hint : '';
      chip.classList.add('show');
    }
  } else chip.classList.remove('show');
}

function updateHighlights(dt) {
  for (const id in spots) {
    const s = spots[id];
    const want = (hovered === id || navFocus === id) && current !== id ? 1 : 0;
    const next = s.hl + (want - s.hl) * Math.min(1, dt * 10);
    if (Math.abs(next - s.hl) < 0.0005 && next === s.hl) continue;
    s.hl = Math.abs(next - want) < 0.002 ? want : next;
    for (const m of s.meshes) {
      const mat = m.material;
      mat.emissive.copy(mat.userData.baseEmissive);
      tmpC.copy(HL).multiplyScalar(s.hl / Math.max(0.5, mat.emissiveIntensity));
      mat.emissive.add(tmpC);
    }
  }
}

function updateMarkers(t, dt) {
  if (markersGone && markersFade > 0) markersFade = Math.max(0, markersFade - dt * 1.6);
  for (const id of PANEL_SPOTS) {
    const s = spots[id];
    if (!s.marker) continue;
    s.marker.visible = markersFade > 0.001;
    const bob = reduceMotion ? 0 : Math.sin(t * 2.2 + s.anchor.x) * 0.08;
    s.marker.position.set(s.anchor.x, s.anchor.y + 0.25 + bob, s.anchor.z);
    const pulse = reduceMotion ? 1 : 1 + Math.sin(t * 3 + s.anchor.z) * 0.08;
    s.marker.scale.setScalar(0.46 * pulse);
    s.marker.material.opacity = markersFade * (hovered === id ? 1 : 0.9);
  }
}

function updateLights(dt, t) {
  const want = lightsOn ? 1 : 0;
  lampLevel += (want - lampLevel) * Math.min(1, dt * 8);
  const L = lampLevel;
  deskSpot.intensity = 22 * L;
  arcLight.intensity = 16 * L;
  fairyLight.intensity = 5 * L;
  refs.deskBulb.material.emissiveIntensity = 0.1 + 2.9 * L;
  refs.arcBulb.material.emissiveIntensity = 0.1 + 2.9 * L;
  refs.arcDome.material.emissiveIntensity = 0.45 * L;
  fairyBulbs.forEach((b) => { b.m.emissiveIntensity = L * (1.4 + Math.sin(t * b.speed + b.phase) * 0.6); });
  if (refs.switchPivot) refs.switchPivot.rotation.x += ((lightsOn ? -0.35 : 0.35) - refs.switchPivot.rotation.x) * Math.min(1, dt * 14);
  tvLight.intensity = 2.4 + Math.sin(t * 7) * 0.25 + Math.sin(t * 2.3) * 0.2;
}

function animate(t, dt) {
  // cat breathing + bounce
  const cat = refs.cat;
  const bt = t - catBounceT;
  if (bt < 0.9) {
    const p = bt / 0.9;
    const hop = reduceMotion ? 0 : Math.max(0, Math.sin(p * Math.PI * 2)) * 0.28 * (1 - p);
    cat.position.y = 0.04 + hop;
    const sq = reduceMotion ? 1 : 1 + Math.sin(p * Math.PI * 4) * 0.12 * (1 - p);
    cat.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
    refs.catTail.rotation.z = Math.PI * 0.05 + Math.sin(bt * 22) * 0.25;
    renderer.shadowMap.needsUpdate = true;
  } else {
    cat.position.y = 0.04; cat.scale.set(1, 1, 1);
    refs.catBody.scale.y = 0.55 * (1 + Math.sin(t * 1.8) * 0.035);
    refs.catTail.rotation.z = Math.PI * 0.05 + Math.sin(t * 0.7) * 0.03;
  }
  zzz.forEach((z) => {
    const p = (t * 0.28 + z.ph) % 1;
    const awake = bt < 2.5;
    z.s.position.set(0.95 + p * 0.25 + Math.sin(p * 6) * 0.05, 0.6 + p * 0.8, 1.55 - p * 0.1);
    z.s.material.opacity = awake ? 0 : Math.sin(p * Math.PI) * 0.85;
    z.s.scale.setScalar(0.14 + p * 0.14);
  });
  steam.forEach((st) => {
    const p = (t * 0.35 + st.ph) % 1;
    st.s.position.set(refs.mugTop.x + Math.sin(p * 7 + st.ph * 9) * 0.04, refs.mugTop.y + p * 0.55, refs.mugTop.z);
    st.s.material.opacity = Math.sin(p * Math.PI) * 0.28;
    st.s.scale.setScalar(0.1 + p * 0.18);
  });
  celestial.clouds.forEach((c) => { c.position.z += c.userData.speed * dt; if (c.position.z > 45) c.position.z = -45; });
  // clock hands
  const now = new Date();
  const m = now.getMinutes() + now.getSeconds() / 60, h = (now.getHours() % 12) + m / 60;
  refs.minHand.rotation.z = -(m / 60) * Math.PI * 2;
  refs.hourHand.rotation.z = -(h / 12) * Math.PI * 2;
  if (skyMode === 'auto' && now.getMinutes() !== lastMinute) {
    if (lastMinute !== -1 && todFromHour(now.getHours()) !== tod) applyTOD(false);
    lastMinute = now.getMinutes();
  }
  // screens
  codeAcc += dt; gameAcc += dt;
  if (codeAcc > 1 / 20) { drawCode(t); codeAcc = 0; }
  if (gameAcc > 1 / 24) { drawGame(gameAcc, t); gameAcc = 0; }
}

function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  const now = performance.now();
  updateCamera(now, dt);
  updateHover();
  updateHighlights(dt);
  updateMarkers(t, dt);
  updateLights(dt, t);
  animate(t, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  fitFog();
  const v = viewFor(current);
  if (tween) tween.to = v; else setCam(v);
}
addEventListener('resize', onResize);

/* ================================================================= BOOT */
applyTOD(true);
onResize();
goTo(null, true);
renderer.shadowMap.needsUpdate = true;
drawCode(0); drawGame(0, 0);
window.__roomReady = true;
requestAnimationFrame(frame);
// deep link: ?spot=work|games|cars|about|contact opens that object on load
if (PANEL_SPOTS.includes(params.get('spot'))) setTimeout(() => openSpot(params.get('spot')), reduceMotion ? 0 : 700);
</script>
</body>
